<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>COREV Radio</title>
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="container">
            <div class="radio-container">
                <div class="radio-antenna"><span>COREV</span></div>
                <div class="radio-knob"><span>COREV</span></div>
                <button id="poweredOff" class="top-power" type="button" aria-label="Turn radio on or off">ON</button>

                <div class="radio-body">
                    <div class="radio-side radio-side-left"></div>
                    <div class="radio-side radio-side-right"></div>

                    <div class="screen">
                        <span class="screen-brand">COREV</span>
                        <span class="screen-version">V<span id="version">1.0.2</span></span>
                        <div class="channel">
                            <input id="channel" type="text" name="channel" maxlength="6" placeholder="0.0" autocomplete="off" inputmode="decimal">
                            <span>MHZ</span>
                        </div>
                    </div>

                    <div class="control-row">
                        <button id="submit" class="ok-button" type="button">OK</button>
                        <button id="muteRadio" class="audio-button" type="button" aria-label="Mute radio">
                            <span class="speaker-icon"></span>
                            <span class="speaker-wave"></span>
                            <span class="speaker-mute"></span>
                        </button>
                        <div class="brand">COREV RADIO</div>
                    </div>

                    <div class="speaker-slots" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span><span></span><span></span>
                    </div>

                    <div class="body-footer" aria-hidden="true">
                        <span>COREV</span><i></i><span>RADIO</span><i></i><span>V<span class="version-text">1.0.2</span></span>
                    </div>

                    <button id="powerPrompt" class="prompt prompt-power" type="button" aria-label="Turn radio on or off">
                        <kbd>E</kbd>
                        <span>TURN ON/OFF</span>
                    </button>
                    <button id="loudSpeaker" class="prompt prompt-speaker" type="button" aria-label="Toggle loudspeaker">
                        <kbd>L</kbd>
                        <span>LOUDSPEAKER</span>
                    </button>
                </div>
            </div>
        </div>
        <script src="js/script.js" type="text/javascript"></script>
    </body>
</html>
